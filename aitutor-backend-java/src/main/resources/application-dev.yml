spring:
  datasource:
    url: jdbc:mysql://localhost:3310/leapmind-voice?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    clean-disabled: false
    out-of-order: false
    encoding: UTF-8
  # ===================================================================
  # 缓存配置 (Caffeine & Redis) -> 合并到 spring 根节点下
  # ===================================================================
  cache:
    type: caffeine
    cache-names:
      - request-deduplication
      - high-frequency-qa
    caffeine:
      spec: >
        initialCapacity=100,
        maximumSize=500,
        expireAfterWrite=300ms
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# ===================================================================
# MyBatis-Plus配置 - 开发环境特定配置
# ===================================================================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===================================================================
# 日志配置 - 开发环境启用详细日志
# ===================================================================
logging:
  level:
    com.treepeople.leapmindtts: DEBUG
    org.java_websocket: DEBUG
    com.treepeople.leapmindtts.service.TextPolishingService: DEBUG
    org.springframework.boot.context.properties: DEBUG

# ===================================================================
# 开发环境下的文本润色配置
# ===================================================================
text-polishing:
  enabled: true
  timeout: 25
  max-retries: 3
  prompt: |
    [开发环境] 请将以下文本润色为适合老师讲课的内容，要求：
    1. 保持原意不变，确保信息准确性
    2. 语言更加生动、易懂，适合学生理解
    3. 适合口语化表达，增强互动感
    4. 增加适当的过渡词和解释，提升连贯性
    5. 保持专业术语的准确性，必要时添加简单解释
    6. 【重要】润色后的内容字数不得超过原文字数+200字
    7. 根据页面类型（如目录、标题页等）调整讲解风格和篇幅
    8. 只返回润色后的教学内容，不要包含任何说明、引导语、分隔符或额外的话语
    原文：
  fallback:
    enabled: true
    use-original-on-error: true
  validation:
    max-text-length: 1000
    min-text-length: 1

# ===================================================================
# Actuator & Prometheus 监控配置 -> 提至根节点 (取消缩进)
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:leapmind-tts}

# ===================================================================
# Resilience4j 服务治理配置 -> 提至根节点 (取消缩进)
# ===================================================================
resilience4j:
  ratelimiter:
    instances:
      userQuestionLimiter:
        limitForPeriod: 10
        limitRefreshPeriod: 1m
        # 修改了此处的中文注释，避免语法检查报错
        timeoutDuration: 0          # 获取令牌超时时长（0 表示未获取到令牌，直接快速拒绝）
  circuitbreaker:
    instances:
      contextCompress:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      aiService:
        slidingWindowSize: 20
        failureRateThreshold: 30
        waitDurationInOpenState: 20s
  timelimiter:
    instances:
      contextCompress:
        timeoutDuration: 10s
        cancelRunningFuture: true
      aiService:
        timeoutDuration: 15s

# ===================================================================
# Python API and Context Compression -> 提至根节点 (取消缩进)
# ===================================================================
python:
  api:
    compress-context-uri: "http://127.0.0.1:8000/api/internal/ai/compress-context"

context:
  compress:
    token-threshold: 200
    max-compressed-tokens: 100
